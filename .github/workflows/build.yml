name: APK Derle ve Yayınla

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK paketleri
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Keystore çöz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Release APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sürüm numarasını oku
        id: ver
        run: echo "code=$(grep 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+' | head -1)" >> "$GITHUB_OUTPUT"

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk "menuboard-v${{ steps.ver.outputs.code }}.apk"

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: menuboard-apk
          path: menuboard-v${{ steps.ver.outputs.code }}.apk

      - name: Release oluştur / güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: Menü Panosu v${{ steps.ver.outputs.code }}
          body: |
            NTX Menü Panosu — otomatik derlenen sürüm.
            Uygulama bu release'i görünce kendini günceller.
          files: menuboard-v${{ steps.ver.outputs.code }}.apk
